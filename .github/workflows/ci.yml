name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.0"

      - name: Install dependencies
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Ruff lint
        run: uv run --locked --no-sync ruff check .

      - name: Unit tests
        run: uv run --locked --no-sync python -m pytest

      - name: Gate test
        run: uv run --locked --no-sync python scripts/perform_gate_test.py

      - name: Upload gate outputs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-outputs-py${{ matrix.python-version }}
          path: test_gate/
          if-no-files-found: ignore
